name: Standalone checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.13
        env:
          POSTGRES_USER: workbench_test
          POSTGRES_PASSWORD: isolated_ci_service_only
          POSTGRES_DB: proposal_workbench_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workbench_test -d proposal_workbench_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Disposable CI service, not an operational identity or reusable secret.
      DATABASE_URL: postgresql://workbench_test:isolated_ci_service_only@127.0.0.1:5432/proposal_workbench_test?schema=public
      TEST_DATABASE_URL: postgresql://workbench_test:isolated_ci_service_only@127.0.0.1:5432/proposal_workbench_test?schema=public
      APP_URL: http://127.0.0.1:3021
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Dependency advisory check
        run: npm audit --audit-level=high
